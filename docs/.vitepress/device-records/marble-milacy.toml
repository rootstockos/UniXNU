schema_version = 1

[device]
name = "marble"
soc = "SM7475"
os_profile = "ipados-17.7.11-21H461"
summary = "Format-2 first-console port for the Redmi Note 12 Turbo / POCO F5 (SM7475). The UEFI image and UniXNU menu are buildable; XNU kernel entry needs user-supplied IPSW inputs; system entry is a documented later stage."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example", "README.md", "AGENTS.md", "porting.toml"]
inputs = ["Board identity, SM7475 SoC profile, iPadOS 17.7.11 OS profile, component selection and external source pins."]
configuration = ["board.toml selects soc_source=sm7475, kit=marble and the iPadOS 17.7.11 profile. The SM7475 DTSI and SMP/cluster patches are pinned through feeds.toml from the sibling UniXNU-sm7475-common repository."]
procedure = ["Run ./unixnu defconfig marble_defconfig, fetch, status and tree from the main UniXNU checkout; inspect the resolved sources and output path."]
findings = ["The common ADT generator now emits AAPL,phandle instead of the FDT spelling phandle. XNU's AddPHandle/IODTFindInterruptParent look up AAPL,phandle; without the rename the UFS interrupt-parent resolved to NULL and IODTGetICellCounts() data-aborted at PC 0xfffffff0078ec2d4 (ESR 0x96000005, FAR 0).", "The board is SM7475-AB (Cape), not SM8550. The CPU topology is 4x A510, 3x A710 and 1x X2, so the shared DTSI differs from SM8550 even though GIC and UFS addresses match.", "The apps-SMMU stream from the vendor DT is 0xE0, while upstream ShengUfs programs 0x60. The local drivers/ShengUfs fork adds native-ufs-stream with a 0xE0 default.", "The stock marble UEFI port provides Resources/DTBs/marble.dtb. The port adds Resources/DTBs/marble-unixnu.dtb with the stale /chosen initrd properties removed, keeping the splash region, so the bootloader can publish the actual payload range and the board does not add a duplicate [[bootimg.dtb_node]]."]
completion = ["All source pins resolve; status shows the intended SoC, OS and device layers; the device tree compiles."]
limits = ["The SM7475 shared repository is published at https://github.com/MiLacy/UniXNU-sm7475-common and pinned to fc78deda27304248186fec2320c5678c45d8e431."]
next_action = ["Run the status check on a clean clone of the published repositories."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board identity, component selection, firmware paths and payload inputs." },
  { kind = "source", reference = "dts/marble.dts", result = "Board memory, splash reservation and CPU cluster tags." },
  { kind = "source", reference = "configs/marble_defconfig", result = "First-console kernel configuration." },
  { kind = "source", reference = "docs/HARDWARE.md", result = "Source-backed hardware inventory." },
]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["README.md", "docs/HARDWARE.md", "proprietary-files.txt", "package/**"]
inputs = ["Mu-Silicium-marble Platforms/Xiaomi/marblePkg, Resources/Configs/marble.toml, the stock Resources/DTBs/marble.dtb and the derived Resources/DTBs/marble-unixnu.dtb, and the four Mu edk2 patches."]
configuration = ["[firmware] selects config=marble, the marble DSC, the 3 MiB FD path and the four Mu patches. UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot are listed in the DSC and DXE.inc."]
procedure = ["Build the firmware with ./unixnu build firmware, then pack an empty-ramdisk boot.img with the marble DTB and boot it with fastboot boot."]
findings = ["The stock marble DSC already includes DiskIoDxe, PartitionDxe, Fat and EnglishDxe; the UniXNU integration adds the four modules and the UniXNULib, FdtLib and HobLib mappings.", "The FD is 3 MiB at 0xA7100000, the same window the stock Mu-Silicium marble port uses.", "Host build 2026-10-30: the DEBUG FD is exactly 0x300000 bytes (SHA-256 6c52e8a4dcdd1483d7ca672de67725f8c76a60ececa956ba81d38a3aa4f7d4b4), and the build log contains UniXNU.efi, UniXNUDxe.efi, UniXNURamDiskDxe.efi and DarwinBoot.efi.", "The stock BootShim header was updated to describe the complete shim plus payload; without that fix the UniXNU boot-image check rejects the image.", "The marble SEC did not save the previous stage's x0 or build gSiliciumEntryArgHobGuid, so UniXNURamDiskDxe could not publish the payload volume and the menu reported no boot entry found. ModuleEntryPoint.S now keeps x0 in x19 and passes it as the third CEntryPoint argument; Sec.c builds the HOB after InitializeMemory. The GUID is present in the FD. DarwinBoot also detects EL2 and returns to EL1h (SPSR_EL2/ELR_EL2 eret, HCR_EL2.RW=1, CNTHCTL_EL2=3, CNTVOFF_EL2=0, CPTR_EL2=0, CPACR_EL1 FPEN) as a defensive guard. The observed fiq_context_init panic was already at EL1 and persisted with that guard; the actual cause is Gunyah trapping the EL1 `CNTP_CTL_EL0` write as UNDEF (instr d51be228, PC 0xfffffff0074204fc), fixed by the device kernel patch marble-virtual-timer-only.patch.", "Resources/DTBs/marble-unixnu.dtb removes the stock /chosen linux,initrd-start/end values so the bootloader's real payload range is the only one the driver sees."]
completion = ["Firmware volume builds at the configured size and contains UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot; the menu appears on the phone."]
limits = ["No hardware boot has been observed in this workspace. The FD size may need RELEASE instead of DEBUG if the added modules overflow 3 MiB."]
next_action = ["Run the Stage 1 real-device test with boot-empty.img and report the first screen/log line."]
evidence = [
  { kind = "host", reference = "README.md", command = "./unixnu build firmware -D ../UniXNU-marble --uefi ../Mu-Silicium-marble --edk2 ../Mu-Silicium-marble/Mu_Basecore", revision = "f0721e9745c45ad2600cd69c74730f1cca55d56a", result = "DEBUG FD built at 0x300000 bytes; build log lists UniXNU.efi, UniXNUDxe.efi, UniXNURamDiskDxe.efi and DarwinBoot.efi; the SEC entry-argument HOB GUID is present in the FD." },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu"]
paths = ["dts/**", "configs/**", "patches/xnu/**", "docs/HARDWARE.md"]
inputs = ["Eight CPU affinities, PSCI smc, GIC distributor 0x17100000/0x10000, redistributors 0x17180000/0x200000, stride 0x40000, 19.2 MHz timer."]
configuration = ["sm7475.dtsi declares cpu0-7, the GIC and the PSCI node. marble.dts tags cpu0-3 E and cpu4-7 P. The SoC patch series adds MAX_CPUS=8, MAX_CPU_CLUSTERS=2 and the Edge scheduler policy."]
procedure = ["Apply the SoC patch series, build the kernel and payload, boot the phone and read the ArmCpu SMP counters and per-CPU work rows."]
findings = ["The vendored stock DT reports Affinity1 core numbers 0x000 through 0x700, so the native-smp-secondary patch is required for secondary CPUs.", "The UFS interrupt specifier now resolves to the GIC: the ADT GIC node carries AAPL,phandle=1 and ufshc interrupt-parent=1. IODTMapInterruptsSharing no longer calls IODTGetICellCounts(NULL).", "Gunyah traps the EL1 CNTP_CTL_EL0 write as UNDEF (device witness PC 0xfffffff0074204fc, instruction d51be228, @sleh.c:1045). marble-virtual-timer-only.patch keeps CNTV enabled and removes the CNTP write, matching the legacy marble port. The kernel now passes fiq_context_init.", "The E/P flags must not be enabled without the AMP patch; MAX_CPU_CLUSTERS would remain 1 and the topology parser would write past its array."]
completion = ["Every enabled CPU reaches its entry checkpoint; timer interrupts and IPIs work on each core; the P cluster carries the UI workload."]
limits = ["No real-device SMP result has been recorded. The first-console command line currently includes cpus=8 but not sheng-smp=1."]
next_action = ["Boot the first-console kernel, then enable sheng-smp=1, armcpu-spi-ipi=1 and armcpu-self-ipi=1 and record per-core counters."]
evidence = [
  { kind = "source", reference = "docs/HARDWARE.md", result = "CPU, GIC and timer values with their vendor-DT source." },
  { kind = "source", reference = "dts/marble.dts", result = "E/P cluster tags and enabled UFS nodes." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "docs/HARDWARE.md"]
inputs = ["UEFI memory map, stock DDR banks, PIL/display/TZ reservations and the firmware FD window at 0xA7100000."]
configuration = ["marble.dts declares a 2 GiB handoff memory node at 0x80000000 and the 0x2B00000 splash reservation at 0xB8000000. payload.adt requests a 4 GiB owned window."]
procedure = ["Compare the DTS handoff, the UEFI memory map and the DarwinBoot free-memory runs; adjust owned_memory_size only after a real-device NO WINDOW or memory-pressure result."]
findings = ["The stock 12 GiB DTB has six DDR banks, but only the low region is a contiguous 2 GiB handoff. The owned window is separate and is placed by DarwinBoot in free memory.", "The memory map reserves 0x1C200000 bytes of PIL, 0x2B00000 display/Demura, 0x10000000 kernel, 0x5000000 OEM VM and 0x20000000 MTE space below 4 GiB."]
completion = ["Memory reservations reconcile with the actual UEFI map; every enabled DMA engine stays inside a mapped range."]
limits = ["No device memory reading exists; owned_memory_size is a conservative 4 GiB choice, not a measured value."]
next_action = ["Read the DarwinBoot window and the kernel RAM/free/available counters on the phone before increasing the window."]
evidence = [
  { kind = "source", reference = "docs/HARDWARE.md", result = "Memory map and reservation table." },
]

[[area]]
id = "storage"
status = "planned"
components = ["SoftwareAES", "ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot", "AppleKeyStoreState"]
paths = ["drivers/ShengUfs/**", "configs/**", "docs/HARDWARE.md"]
inputs = ["UFS host 0x1d84000/0x3000, PHY 0x1d80000/0x2000, apps SMMU 0x15000000, UFS stream 0xE0, GCC 0x100000, userdata GPT."]
configuration = ["The local ShengUfs fork adds native-ufs-stream with a 0xE0 default. marble_defconfig keeps CONFIG_XNU_NATIVE_UFS, the verified-root chain and the Data chain off; the component is selected only when those inputs exist."]
procedure = ["Build the UFS component, boot with native-ufs-root=1, read the capacity/GPT/known blocks, then enable the verified-root bundle and Data seed."]
findings = ["Upstream ShengUfs hardcodes stream 0x60; the vendor marble DT uses 0xE0. The fork changes the stream argument and the SMR match scan.", "Device probe 2026-10-31 (read-only, no writes): UFS host/GCC and the SMMU bank-2 takeover work. userdata first=0x2f6a00 last=0x3b037fa (4096-byte LBAs, 224.2 GiB); block0 has no SHNGROOT manifest (manifest status=1, windows=0), so it is the Android ext4 userdata. The geometry is now in board.toml [userdata].", "The first UFS probe reached SMMU planning and stopped at `conflicting UFS stream mapping`. The device reported slot=2 bank=74 smr=800000e0 s2cr=2 id2=5111: the firmware leaves an exclusive SMR for stream 0xE0 mapped to translating context bank 2.", "The fork now accepts that exclusive bank with native-ufs-smmu-takeover=1 and clears SCTLR/CBAR before using it as the driver bypass context. The first takeover build still failed because planUfsSmmu only scanned the top eight banks; the retry range is now the full context-bank count, so it reaches firmware bank 2. The rebuilt probe should continue to the GPT/userdata read.", "The probe build selects ShengUfs with NATIVE_UFS_PROBE_ONLY=1 and passes native-ufs-probe=10. The kernel contains NativeUfs but not NativeUfsBlock/IOBlockStorageDevice, avoiding the unbound storage base symbols; the probe reads the userdata GPT and first block and panics with the geometry.", "Next: fill [userdata] first_lba/last_lba from the probe, build the OS/SystemOS userdata image, then enable the verified-root/Data/display chain.", "The controller, GCC and SMMU bases match the SM8550 layout, but the per-controller clock/power state and the UFS PHY ownership are not measured on marble.", "ShengUfs's root layout reads the userdata partition from LUN 0's 4096-byte GPT; no geometry is filled in yet.", "A probe-only attempt exposed an upstream compile error: timerTicks() and native_ufs_read_ticks were inside the NATIVE_VERIFIED_BLOCK guard. The fork moves them outside it so the transport can be compiled without the verified-root bundle."]
completion = ["UFS registers read, GPT and capacity match, root mounts and launchd starts, Data writes stay inside the measured window."]
limits = ["No UFS transaction has been run on marble in this workspace. The verified-root bundle, Data seed and root UUID inputs are not provisioned, so UFS is not selected in the first-console build."]
next_action = ["After the console boot, capture the GPT, build the verified-root bundle, then select ShengUfs and enable native-ufs-root=1."]
evidence = [
  { kind = "source", reference = "drivers/ShengUfs/NativeUfs.cpp", result = "Stream override implementation and SM8550 register constants." },
  { kind = "source", reference = "docs/HARDWARE.md", result = "UFS, SMMU and GCC sources." },
]

[[area]]
id = "display"
status = "planned"
components = ["GopFramebuffer"]
paths = ["dts/**", "docs/HARDWARE.md", "docs/FULL-SYSTEM.md"]
inputs = ["1080x2400 GOP framebuffer, splash region 0xB8000000/0x2B00000, UEFI SimpleFbDxe."]
configuration = ["GopFramebuffer is selected but CONFIG_XNU_NATIVE_LEGACY_DISPLAY is off in the first-console defconfig. The legacy archive and board probe are described in docs/FULL-SYSTEM.md."]
procedure = ["Enable the legacy display archive, add offline-legacy-register=1 and offline-legacy-gop=1, then verify geometry, colors and the userland transition."]
findings = ["The stock Mu-Silicium marble platform publishes a 1080x2400 32-bit GOP on the ABL framebuffer.", "The sheng/alioth display stack binds the original IOMobileFramebufferLegacy; it is OS-version-specific and must be re-proved against this kernel at build time."]
completion = ["A known frame appears with correct geometry and colors, then the boot progress and Hello screen present."]
limits = ["The legacy display archive is not wired into this repository yet; the first console relies on the XNU framebuffer console."]
next_action = ["Port the display-only parts of the alioth legacy archive, then test the panel on the phone."]
evidence = [
  { kind = "source", reference = "docs/HARDWARE.md", result = "Panel and splash values." },
]

