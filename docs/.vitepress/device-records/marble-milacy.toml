paths = ["docs/HARDWARE.md", "docs/FULL-SYSTEM.md"]
inputs = ["PMIC, RPMh, battery, charger and CPU frequency domains."]
configuration = ["No power component is selected. The first console boots on external power."]
procedure = ["Add the PMGR placeholder for AMFI, then implement battery/charger and CPU frequency policy."]
findings = ["Unmodified AMFI expects an ApplePMGR provider and panics at ConfigurationSettings.cpp:235 with `No PMGR?` when none exists. The board package now carries ShengPlatformPower.cpp and scripts/build-platform-power.py; CONFIG_XNU_SHENG_PMGR=y plus sheng-pmgr=2 publishes the guarded placeholder from the original ApplePMGR ABI. It implements no hardware power operation and panics on any power call, so it is a bring-up bridge, not power management.", "No suspend/resume, battery or charger support exists in this image."]
completion = ["Rails/clocks are owned, a supported power transition recovers, and battery readings match the device."]
