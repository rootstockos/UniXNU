[[area]]
id = "packaging"
status = "host-verified"
components = ["XnuPrelink"]
paths = ["package/**", "configs/**", "docs/**"]
inputs = ["XNU source, iPadOS kernelcache, trust cache, Data seed, firmware DTB and UEFI FD."]
configuration = ["[kernel] prelink comes from the iPadOS 17.7.11 profile. [payload] selects a 192 MiB FAT volume, panic screen and the first-console arguments. [firmware] supplies the FD path."]
procedure = ["Build kernel, payload and boot image in order; inspect boot.json and payload.json before booting."]
findings = ["The OS profile pins the same 21H461 kernelcache and trust caches used by sheng and alioth.", "The payload path is resolved relative to \\EFI\\UniXNU, so the builder writes \\EFI\\UniXNU\\Payloads\\kernel.macho; a file at the FAT root is not found.", "mformat -F produced a FAT32 BPB that the EDK2 FAT driver refused (TotSec16 nonzero with TotSec32 zero). The builder now creates FAT16 (mkfs.fat -F 16, or mformat without -F) and rejects FAT32 or a missing 0x55AA signature.", "UniXNURamDiskDxe validates the FAT boot sector, aligns initrd-end down to 512 bytes and calls ConnectController after installing BlockIo. UniXNU also connects all controllers before scanning for unixnu.toml, so the payload volume appears without relying on BDS enumeration order.", "The working fastboot boot path is an Android v0 image: kernel 0x80008000, ramdisk 0x80C00000, DTB /chosen initrd 0x80C00000-0x84C00000. The earlier v4 image did not load the ramdisk reliably.", "Host build 2026-10-30: kernel.macho SHA-256 e681a0b8e09f666703594025ccf13890db72a939c0f523c5cb51b340e5b8281a; the two-module original trust bundle SHA-256 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7; payload.img 64 MiB (FAT16); boot.img 68947968 bytes with the Android v0 header, kernel at 0x80008000, ramdisk at 0x80C00000 and the marble firmware DTB.", "The payload FAT volume contains EFI/UniXNU/unixnu.toml, Payloads/kernel.macho, kernel.macho.adt and kernel.macho.trustcache; the empty-ramdisk Stage 1 image is 1839104 bytes."]
completion = ["Kernel and prelink succeed, the payload contains all declared inputs, and the boot image matches the Android v0 header, the fixed ramdisk range and the 192 MiB partition."]
limits = ["The userdata image is not built because the GPT geometry and Data seed are not present. No boot image has been run on hardware."]
next_action = ["Run the Stage 2 real-device test with boot.img and report the DARWINBOOT lines and the first kernel lines."]
evidence = [
  { kind = "host", reference = "README.md", command = "./unixnu build kernel -D ../UniXNU-marble && ./unixnu build payload -D ../UniXNU-marble --uefi ../Mu-Silicium-marble --trust-cache ../UniXNU-marble/build/marble-trust.bundle --unique-chip-id 4d4152424c45 && ./unixnu bootimg -D ../UniXNU-marble --uefi ../Mu-Silicium-marble --dtb ../Mu-Silicium-marble/Resources/DTBs/marble-unixnu.dtb", revision = "f0721e9745c45ad2600cd69c74730f1cca55d56a", result = "Kernel, prelink, payload and both boot images built and verified on the host; hardware_tested is false." },
]

