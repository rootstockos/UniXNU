schema_version = 1

[device]
name = "unicorn"
soc = "SM8475"
os_profile = "ipados-18.7.10-22H374"
summary = "Xiaomi 12S Pro (unicorn, SM8475)：以 Pong/Thor 的格式2 方法从零移植 UniXNU，UEFI 已上屏（M1/M2 达成），内核与 payload 走 macOS CI"

[[area]]
id = "configuration"
status = "implemented"
components = ["PongPlatform24"]
paths = ["board.toml", "configs/unicorn_ipados18_defconfig", "dts/unicorn.dts", "verified-facts.json", "os-profiles/**", "scripts/bootstrap-unicorn.sh"]
inputs = ["本机 root 采集的 35 份 dump 与 live device tree", "Pong/Thor 的格式2 四层配置（ARM64 → SM8475 → 18.7.10 → unicorn）", "iPad 10.2 18.7.10 (22H374) restore"]
configuration = ["board.toml 选 ipados-18.7.10-22H374 与 kit=unicorn", "configs/unicorn_ipados18_defconfig：ARMCPU=y + SOURCE_CORECRYPTO14=y + OWNER_* 关闭", "dts/unicorn.dts：12 GiB @0x80000000、38 段 reserved-memory、触摸/按键/UFS/PCIe 节点"]
procedure = ["用 scripts/collect-device.sh 在 root 手机上只读采集", "scripts/bootstrap-unicorn.sh 重建 soc-seed 并 pin 框架到 0fc0fc1f", "scripts/audit-inherited-values.py 逐条核对没有沿用兄弟机型的数字"]
findings = ["所有板级数值都必须能追溯到本机采集，audit 脚本 13/13 通过后才允许进构建", "格式2 要求 local.toml 只保留 soc + kit 两处本地覆盖，其余走 feeds.toml 的 git pin"]
completion = ["bootstrap 在干净环境可重复产出同一套配置"]
limits = ["尚未在 CI 上复核 unicorn.dts 的每一段 reserved-memory 是否都必要"]
next_action = ["随 M3 一起用内核日志（ramoops/串口）复核保留区是否与实际使用一致"]
evidence = [
  {kind = "source", reference = "board.toml", result = "四层配置与 IPSW 选择（iPad7,11 / 22H374 / j171ap）已写入并在 CI 上跑通 bootstrap"},
  {kind = "source", reference = "verified-facts.json", result = "13 条实测事实（面板、触摸、按键、UFS、PCIe、ramoops、userdata LBA 等）逐条有采集出处"}
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["PongPlatform24"]
paths = ["scripts/bootstrap-unicorn.sh", ".github/workflows/kernel-macos.yml", "docs/evidence/m1-menu.md", "docs/evidence/m3-payload-menu.md"]
inputs = ["Mu-Silicium/EDK2（Mu_Basecore + Silicon/Qualcomm + Silicium-ACPI）", "本机 live DT 作为 FdtBlob", "K60(mondrian) 原版 MemoryMapLib（M2 已验证组合）"]
configuration = ["FD 基址 0xA7400000、长度 0x300000，PcdCPUCoresStackBase=0xA760D000", "ACPI 表暂时禁用（AML 不完整）", "引导容器必须 Android boot header v4 + 1 MiB 占位 ramdisk"]
procedure = ["WSL 里 unixnu build firmware --target RELEASE 产出 SILICIUM_UEFI.fd", "scripts/make-m3-image.sh 用 build-bootimg.py 打 v4 容器", "fastboot boot 只进 RAM，不写任何分区"]
findings = ["用 adb 判断『固件是否活着』会误判：adb server 会返回幽灵设备，必须用 USB VID/PID 采样", "菜单倒计时结束后若没有可启动项，会显示警示三角形并关机（走配置里的 shutdown 项），这不是崩溃", "ramdisk 为空时菜单必然没有启动项——启动项来自 ramdisk 里的 EFI/UniXNU/Payloads/kernel.macho"]
completion = ["屏幕上出现 UniXNU 菜单，且音量键能移动、电源键能确认"]
limits = ["面板初始化参数（DCS/DSI）尚未按本机 LTPO 面板逐项核对"]
next_action = ["M3 通过后恢复 ACPI 表（补齐 AML）并验证 USB 键盘"]
evidence = [
  {kind = "device", reference = "docs/evidence/m1-menu.md", result = "fastboot boot 后屏幕出现 UniXNU 菜单；硬件侧 90 秒无 USB 枚举，确认固件在运行", command = "fastboot boot out/unicorn-uefi-M1f-goldfd.img", revision = "1b2a355607fe9d7691c6108cf889d9d5da64157a"},
  {kind = "source", reference = "scripts/bootstrap-unicorn.sh", result = "bootstrap 在 GitHub macOS runner 上跑通：pin / soc-seed / profile / defconfig / fetch 全部成功"}
]

[[area]]
id = "cpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/unicorn_ipados18_defconfig", "board.toml", "dts/unicorn.dts"]
inputs = ["SM8475 8 核（1×X3 + 4×A715/A710 + 3×A510）", "Pong 的 MACHINE_CONFIGS=PONG 机器配置"]
configuration = ["ARMCPU=y，使用真实 ArmCpu 中断提供者", "cpus=1 作为首启参数，降低早期并发风险"]
procedure = ["defconfig 打开 ARMCPU 与 SOURCE_CORECRYPTO14，关闭 OWNER_* 以满足离线 SystemOS 的独立 root 前提"]
findings = ["缺 ARMCPU 会在构造期被守卫拒绝：Architectural timer entry requires the actual ArmCpu interrupt provider", "MACHINE_CONFIGS 必须是 PONG；BCM2837 会报 Unsupported CURRENT_MACHINE_CONFIG"]
completion = ["内核在单核下进入 launchd"]
limits = ["多核启动与 GIC 亲和性尚未验证"]
next_action = ["M3 后按核逐个放开并观察中断分布"]
evidence = [
  {kind = "source", reference = "configs/unicorn_ipados18_defconfig", result = "ARMCPU=y、SOURCE_CORECRYPTO14=y、OWNER_* 关闭；CI 上据此完成内核配置"}
]

[[area]]
id = "memory"
status = "implemented"
components = ["PongPlatform24"]
paths = ["dts/unicorn.dts", "verified-facts.json", "docs/evidence/m1-menu.md"]
inputs = ["MemTotal 11,444,364 kB（12 GiB）", "本机 /proc/iomem 与 live DT 的 reserved-memory"]
configuration = ["DDR 从 0x80000000 起 12 GiB", "38 段 reserved-memory 原样进 DT", "userdata 分区 first_lba 0x2AE13BB / last_lba 0x3AE1F7A / lba_bytes 4096"]
procedure = ["从 live DT 直接抽取 reserved-memory 生成 dts/unicorn.dts", "UEFI 侧沿用 mondrian 的 K60 MemoryMapLib（M2 已点亮组合），并保留 ABL staging 窗口"]
findings = ["我们按 reserved-memory 自己生成的 MemoryMapLib 在 M2 对照实验中黑屏，K60 原版反而点亮——说明 UEFI 侧内存描述符需要逐项二分，暂以 K60 表为基线", "ramoops 位于 0xA7000000 + 0x400000，FD 取 0xA7400000 正好避开"]
completion = ["UEFI 能稳定运行且内核能接管同一份内存图"]
limits = ["unicorn 自有的 trusted_apps 两段（0xEA000000 / 0xED900000）在 UEFI 表里尚未纳入"]
next_action = ["M3 后用内核日志二分修正 MemoryMapLib，替换 K60 表"]
evidence = [
  {kind = "source", reference = "dts/unicorn.dts", result = "12 GiB @0x80000000、38 段 reserved-memory、userdata LBA 均来自本机采集"},
  {kind = "device", reference = "docs/evidence/m1-menu.md", result = "使用 K60 MemoryMapLib 的固件在本机能出菜单并稳定运行 90 秒以上", command = "fastboot boot out/unicorn-uefi-M1f-goldfd.img", revision = "1b2a355607fe9d7691c6108cf889d9d5da64157a"}
]

